name: liv_driver_app
description: LIV POC - Driver/Courier demo app (OpenStreetMap, WebSocket tracking).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  geolocator: ^10.1.0
  crypto: ^3.0.3
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
