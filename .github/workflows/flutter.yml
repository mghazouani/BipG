name: Flutter CI

on:
  push:
    paths:
      - "liv_driver_app/**"
      - "liv_client_app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "liv_driver_app/**"
      - "liv_client_app/**"
      - ".github/workflows/flutter.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - liv_driver_app
          - liv_client_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze
